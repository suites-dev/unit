name: Prepare Release
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Graduate the current prereleases, or version stable packages from conventional commits
        type: choice
        options: [graduate, stable]
        required: true
        default: graduate

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  e2e:
    if: github.ref == 'refs/heads/master'
    name: E2E Release Simulation
    uses: ./.github/workflows/e2e-release.yml
    with:
      target_branch: master
      commit: ${{ github.sha }}

  prepare:
    name: Open release PR
    needs: e2e
    runs-on: ubuntu-latest
    env:
      RELEASE_TYPE: ${{ inputs.release_type }}
      RELEASE_BRANCH: chore/release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:release
      - name: Prepare versions and changelogs without tags
        id: changes
        run: |
          git switch -c "$RELEASE_BRANCH"
          args=(--yes --conventional-commits --no-git-tag-version --no-push --no-commit-hooks --ignore-scripts --allow-branch "$RELEASE_BRANCH")
          case "$RELEASE_TYPE" in
            graduate) args+=(--conventional-graduate) ;;
            stable) ;;
            *) exit 1 ;;
          esac
          pnpm exec lerna version "${args[@]}"
          pnpm install --lockfile-only --ignore-scripts
          if git diff --quiet; then
            echo 'No version changes to prepare.' >> "$GITHUB_STEP_SUMMARY"
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Mint release bot token
        if: steps.changes.outputs.changed == 'true'
        id: release-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SUITES_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUITES_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Commit and open the release PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          BOT_SLUG: ${{ steps.release-app.outputs.app-slug }}
        run: |
          bot_id=$(gh api "users/${BOT_SLUG}[bot]" --jq .id)
          git config user.name "${BOT_SLUG}[bot]"
          git config user.email "${bot_id}+${BOT_SLUG}[bot]@users.noreply.github.com"
          git add packages pnpm-lock.yaml
          git -c core.hooksPath=/dev/null commit -m 'chore(release): version stable packages'
          git -c credential.helper= -c credential.helper='!gh auth git-credential' \
            push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          body="$RUNNER_TEMP/release-pr.md"
          {
            echo 'Review the package versions and generated changelogs, then merge this PR into master.'
            echo
            echo 'After merging, run **Publish Packages** on master with the full merge commit SHA. Approve the release environment after reviewing the publication plan.'
            echo
            echo 'This PR does not publish packages or create tags.'
            echo
            pnpm exec lerna list --json --no-private | jq -r '.[] | "- `\(.name)@\(.version)`"'
          } > "$body"
          gh pr create --base master --head "$RELEASE_BRANCH" \
            --title 'chore(release): version stable packages' --body-file "$body" >> "$GITHUB_STEP_SUMMARY"
