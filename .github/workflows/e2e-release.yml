name: E2E Release Simulation
env:
  CI: true

on:
  workflow_call:
    inputs:
      target_branch:
        description: 'Must match the branch selected for the calling workflow'
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-full:
    name: Full E2E (${{ matrix.e2e-project }}, Node ${{ matrix.node-version }})
    env:
      REQUESTED_BRANCH: ${{ inputs.target_branch }}
      RUN_BRANCH: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        e2e-project:
          [
            'jest/nestjs',
            'vitest/nestjs',
            'jest/inversify',
            'vitest/inversify',
            'esm/jest/nestjs',
            'esm/vitest/nestjs',
          ]
        node-version: [22.x, 24.x, 26.x]
    steps:
      - name: Verify release branch
        run: |
          if [ -n "$REQUESTED_BRANCH" ] && [ "$REQUESTED_BRANCH" != "$RUN_BRANCH" ]; then
            echo "Select the release target in the calling workflow's branch selector." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
          fetch-depth: 0

      # Build and publish with the supported development toolchain.
      - name: Setup Node for build tools
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Verdaccio Docker
        run: |
          docker run -d --name verdaccio \
          -p 4873:4873 \
          -v ${{ github.workspace }}/e2e/config.yaml:/verdaccio/conf/config.yaml \
          verdaccio/verdaccio

      - name: Build
        run: pnpm build

      - name: Configure local test registry
        env:
          TEST_NPMRC: ${{ runner.temp }}/verdaccio.npmrc
        run: |
          printf '%s\n' 'registry=http://localhost:4873/' '@suites:registry=http://localhost:4873/' > "$TEST_NPMRC"
          echo "NPM_CONFIG_USERCONFIG=$TEST_NPMRC" >> "$GITHUB_ENV"

      - name: Install jq
        run: sudo apt-get install jq

      - name: Restrict package publishing to the local test registry
        run: |
          find packages -name 'package.json' | while read filename; do
            jq 'del(.publishConfig.provenance) | .publishConfig.registry = "http://localhost:4873"' "$filename" > temp.json && mv temp.json "$filename"
          done

      - name: Config Git
        run: |
          git config --global user.email "e2e@suites.dev"
          git config --global user.name "Suites e2e"

      - name: Commit Provenance Change
        run: |
          git add .
          git commit -am "remove provenance"

      - name: Version Packages
        run: |
          pnpm exec lerna version --yes \
          --conventional-commits \
          --conventional-prerelease \
          --preid e2e \
          --no-changelog \
          --allow-branch "$RUN_BRANCH" \
          --no-git-tag-version \
          --no-push \
          --force-publish \
          --no-commit-hooks

      - name: Commit Packages Versions
        run: |
          git add .
          git commit -am "bump versions"

      - name: Capture Versions for Report
        run: |
          echo "## 📦 E2E Release Simulation (Node ${{ matrix.node-version }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** ${{ matrix.e2e-project }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Simulated Versions:" >> $GITHUB_STEP_SUMMARY
          pnpm exec lerna ls --json | jq -r '.[] | "- **\(.name)** → `v\(.version)`"' >> $GITHUB_STEP_SUMMARY

      - name: Publish Packages to Verdaccio
        run: |
          pnpm lerna publish from-package --yes \
          --registry http://localhost:4873 \
          --no-git-tag-version \
          --no-push \
          --no-git-reset \
          --exact \
          --dist-tag e2e

      - name: Clean Source
        run: |
          rm -rf packages
          rm -rf node_modules
          rm pnpm-lock.yaml pnpm-workspace.yaml
          rm package.json
          rm -f .npmrc

      # Exercise the published packages on every consumer runtime in the matrix.
      - name: Setup Node ${{ matrix.node-version }} for tests
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test supported DI versions from Verdaccio
        run: node e2e/run-di-compatibility.cjs "${{ matrix.e2e-project }}"

      - name: Test Success Summary
        if: success()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Test Passed** - Packages work correctly when published" >> $GITHUB_STEP_SUMMARY
