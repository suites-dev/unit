name: E2E Release Simulation

on:
  workflow_dispatch:
    inputs:
      vitest_candidate_run:
        description: 'Unit 4 E2E run ID containing vitest-adapter-candidate'
        required: true
        type: string
  workflow_call:
    inputs:
      target_branch:
        description: 'Must match the selected maintenance branch'
        required: false
        type: string
      vitest_candidate_run:
        description: 'Unit 4 E2E run ID containing vitest-adapter-candidate'
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  CI: true

jobs:
  vitest:
    name: Branch Vitest compatibility (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - name: Verify selected maintenance branch
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          RUN_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -n "$TARGET_BRANCH" ] && [ "$TARGET_BRANCH" != "$RUN_BRANCH" ]; then
            echo 'Select the maintenance branch in the workflow branch selector.' >&2
            exit 1
          fi

      - name: Checkout this maintenance branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup build runtime
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          package-manager-cache: false

      - name: Install this branch’s package manager
        uses: pnpm/action-setup@v6

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Unit and Nest adapter from this branch
        run: pnpm --filter '@suites/unit...' --filter '@suites/di.nestjs...' -r run build

      - name: Download candidate adapter
        uses: actions/download-artifact@v8
        with:
          name: vitest-adapter-candidate
          run-id: ${{ inputs.vitest_candidate_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/vitest-candidate

      - name: Pack this branch’s packages
        run: node e2e/run-vitest-compatibility.cjs --prepare "$RUNNER_TEMP/vitest-compatibility" "$RUNNER_TEMP/vitest-candidate"

      - name: Run isolated local registry
        run: |
          docker run -d --name verdaccio -p 4873:4873 \
            -v "$GITHUB_WORKSPACE/e2e/config.yaml:/verdaccio/conf/config.yaml" \
            verdaccio/verdaccio

      - name: Remove workspace source before consumer tests
        run: rm -rf packages node_modules package.json pnpm-lock.yaml pnpm-workspace.yaml .npmrc

      - name: Setup consumer runtime
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install consumer package manager
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Test candidate against branch packages
        run: node e2e/run-vitest-compatibility.cjs --run "$RUNNER_TEMP/vitest-compatibility"

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-compatibility-${{ matrix.node-version }}
          path: |
            ${{ runner.temp }}/vitest-compatibility/branch.json
            ${{ runner.temp }}/vitest-compatibility/*.lock.yaml
