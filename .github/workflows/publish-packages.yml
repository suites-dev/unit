name: Publish Packages
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full reviewed master HEAD commit SHA (must match the workflow run)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CI: true
  APPROVED_COMMIT: ${{ inputs.commit }}
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  plan:
    name: Review publication plan
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select the reviewed master commit
        run: |
          [[ "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$APPROVED_COMMIT" = "$GITHUB_SHA" # npm provenance identifies the workflow commit
          git switch --detach "$APPROVED_COMMIT"
      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node scripts/release-publication.cjs plan "$RUNNER_TEMP/publication.json"

  e2e:
    name: Test reviewed commit
    needs: plan
    uses: ./.github/workflows/e2e-release.yml
    with:
      target_branch: master
      commit: ${{ inputs.commit }}

  publish:
    name: Publish reviewed packages and tags
    needs: [plan, e2e]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select the reviewed master commit
        run: |
          [[ "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$APPROVED_COMMIT" = "$GITHUB_SHA" # npm provenance identifies the workflow commit
          git switch --detach "$APPROVED_COMMIT"
      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:release
      - name: Mint release bot token
        id: release-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SUITES_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SUITES_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Recheck publication plan
        id: publication
        run: |
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          node scripts/release-publication.cjs plan "$RUNNER_TEMP/publication.json"
      - name: Publish missing versions to latest with npm Trusted Publishing
        if: steps.publication.outputs.pending != '0'
        run: pnpm exec lerna publish from-package --yes --dist-tag latest --git-head "$APPROVED_COMMIT"
      - name: Verify published versions, source commits, latest tags and tarballs
        run: node scripts/release-publication.cjs verify "$RUNNER_TEMP/publication.json"
      - name: Create immutable package tags and GitHub Releases
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          BOT_SLUG: ${{ steps.release-app.outputs.app-slug }}
        run: |
          bot_id=$(gh api "users/${BOT_SLUG}[bot]" --jq .id)
          git config user.name "${BOT_SLUG}[bot]"
          git config user.email "${bot_id}+${BOT_SLUG}[bot]@users.noreply.github.com"
          node scripts/release-publication.cjs finalize "$RUNNER_TEMP/publication.json"
          echo 'Published versions, latest tags, tarballs, package tags and GitHub Releases verified.' >> "$GITHUB_STEP_SUMMARY"
