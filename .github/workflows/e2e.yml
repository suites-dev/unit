name: E2E Tests
env:
  CI: true

on:
  pull_request:
    branches:
      - next
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-preview:
    name: Version Preview
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.capture.outputs.versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create local simulation branch
        run: git checkout -B e2e-simulation

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Config Git
        run: |
          git config --global user.email "e2e@suites.dev"
          git config --global user.name "Suites e2e"

      - name: Version Packages (Preview)
        run: |
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
          pnpm exec lerna version --yes \
          --conventional-commits \
          --conventional-prerelease \
          --preid e2e \
          --no-changelog \
          --allow-branch "$BRANCH_NAME" \
          --no-git-tag-version \
          --no-push \
          --force-publish \
          --no-commit-hooks

      - name: Capture Versions
        id: capture
        run: |
          echo "## 📦 E2E Version Preview" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "These versions will be tested in the e2e workflow:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          pnpm exec lerna ls --json | jq -r '.[] | "- **\(.name)** → `v\(.version)`"' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🧪 Testing Matrix" >> $GITHUB_STEP_SUMMARY
          echo "- **Projects**: 10 (jest/nestjs, vitest/nestjs, esm/jest/nestjs, esm/vitest/nestjs, jest/inversify, vitest/inversify, jest/injection-js, vitest/injection-js, esm/jest/injection-js, esm/vitest/injection-js)" >> $GITHUB_STEP_SUMMARY
          echo "- **DI versions**: NestJS 10/11/12, Inversify 7/8 and InjectionJS 2, minimum and current releases" >> $GITHUB_STEP_SUMMARY
          echo "- **Node versions**: 3 (22.x, 24.x, 26.x)" >> $GITHUB_STEP_SUMMARY
          echo "- **Total jobs**: 30 (10 projects x 3 Node versions)" >> $GITHUB_STEP_SUMMARY

          # Save versions for artifacts
          pnpm exec lerna ls --json > versions.json

      - name: Upload Version Info
        uses: actions/upload-artifact@v7
        with:
          name: version-preview
          path: versions.json

  e2e:
    name: E2E (${{ matrix.e2e-project }}, Node ${{ matrix.node-version }})
    needs: [version-preview]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        e2e-project: [
            # NestJS
            'jest/nestjs',
            'vitest/nestjs',
            'esm/jest/nestjs',
            'esm/vitest/nestjs',
            # Inversify
            'jest/inversify',
            'vitest/inversify',
            'jest/injection-js',
            'vitest/injection-js',
            'esm/jest/injection-js',
            'esm/vitest/injection-js',
          ]
        node-version: [22.x, 24.x, 26.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create local simulation branch
        run: git checkout -B e2e-simulation

      # Build and publish with the supported development toolchain.
      - name: Setup Node for build tools
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Verdaccio Docker
        run: |
          docker run -d --name verdaccio \
          -p 4873:4873 \
          -v ${{ github.workspace }}/e2e/config.yaml:/verdaccio/conf/config.yaml \
          verdaccio/verdaccio

      - name: Build
        run: pnpm build

      - name: Pack branch packages for Vitest compatibility
        if: matrix.e2e-project == 'vitest/nestjs'
        run: node e2e/run-vitest-compatibility.cjs --prepare "$RUNNER_TEMP/vitest-compatibility"

      - name: Share candidate adapter with maintenance branches
        if: matrix.e2e-project == 'vitest/nestjs' && matrix.node-version == '26.x'
        uses: actions/upload-artifact@v7
        with:
          name: vitest-adapter-candidate
          path: ${{ runner.temp }}/vitest-compatibility/candidate/*.tgz
          if-no-files-found: error

      - name: Configure local test registry
        env:
          TEST_NPMRC: ${{ runner.temp }}/verdaccio.npmrc
        run: |
          printf '%s\n' 'registry=http://localhost:4873/' '@suites:registry=http://localhost:4873/' > "$TEST_NPMRC"
          echo "NPM_CONFIG_USERCONFIG=$TEST_NPMRC" >> "$GITHUB_ENV"

      - name: Install jq
        run: sudo apt-get install jq

      - name: Restrict package publishing to the local test registry
        run: |
          find packages -name 'package.json' | while read filename; do
            jq 'del(.publishConfig.provenance) | .publishConfig.registry = "http://localhost:4873"' "$filename" > temp.json && mv temp.json "$filename"
          done

      - name: Config Git
        run: |
          git config --global user.email "e2e@suites.dev"
          git config --global user.name "Suites e2e"

      - name: Commit Provenance Change
        run: |
          git add .
          git commit -am "remove provenance"

      - name: Version Packages
        run: |
          BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD)
          pnpm exec lerna version --yes \
          --conventional-commits \
          --conventional-prerelease \
          --preid e2e \
          --no-changelog \
          --allow-branch "$BRANCH_NAME" \
          --no-git-tag-version \
          --no-push \
          --force-publish \
          --no-commit-hooks

      - name: Allow this run's simulated prereleases in internal peers
        run: node e2e/align-simulation-peers.cjs

      - name: Commit Packages Versions
        run: |
          git add .
          git commit -am "bump versions"

      - name: Publish Packages to Verdaccio
        run: |
          pnpm lerna publish from-package --yes \
          --registry http://localhost:4873 \
          --no-git-tag-version \
          --no-push \
          --no-git-reset \
          --exact \
          --dist-tag e2e

      - name: Clean Source
        run: |
          rm -rf packages
          rm -rf node_modules
          rm pnpm-lock.yaml pnpm-workspace.yaml
          rm package.json
          rm -f .npmrc

      # Exercise the published packages on every consumer runtime in the matrix.
      - name: Setup Node ${{ matrix.node-version }} for tests
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test supported DI versions from Verdaccio
        run: node e2e/run-di-compatibility.cjs "${{ matrix.e2e-project }}"

      - name: Check candidate adapter with this branch’s Unit packages
        if: matrix.e2e-project == 'vitest/nestjs'
        run: node e2e/run-vitest-compatibility.cjs --run "$RUNNER_TEMP/vitest-compatibility"

      - name: Upload branch compatibility evidence
        if: always() && matrix.e2e-project == 'vitest/nestjs'
        uses: actions/upload-artifact@v7
        with:
          name: vitest-compatibility-${{ matrix.node-version }}
          path: |
            ${{ runner.temp }}/vitest-compatibility/branch.json
            ${{ runner.temp }}/vitest-compatibility/*.lock.yaml
