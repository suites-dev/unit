version: 2
updates:
  - package-ecosystem: 'npm'
    directories:
      - '/'
      - '/e2e/jest/*'
      - '/e2e/vitest/*'
      - '/e2e/esm/jest/*'
      - '/e2e/esm/vitest/*'
    schedule:
      interval: 'daily' # Check for updates daily
    commit-message:
      prefix: 'deps'
    open-pull-requests-limit: 10
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      jest:
        patterns:
          - 'jest'
          - '@jest/*'
          - '@types/jest'
          - 'jest-environment-*'
          - 'ts-jest'
      eslint:
        patterns:
          - 'eslint'
          - '@eslint/*'
          - '@typescript-eslint/*'
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Upgrade the supported Node majors deliberately.
      - dependency-name: '@types/node'
        versions: ['>=27']
      # Revisit when ts-jest and typescript-eslint support TypeScript 7.
      - dependency-name: 'typescript'
        versions: ['>=7']

  - package-ecosystem: 'github-actions'
    directory: '/' # Location of GitHub Actions workflows
    schedule:
      interval: 'daily' # Check for updates daily
    commit-message:
      prefix: 'deps'
    open-pull-requests-limit: 10
