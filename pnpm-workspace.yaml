packages:
  - 'e2e'
  - 'packages/*'
  - 'packages/di/*'
  - 'packages/doubles/*'
  - 'packages/types/*'
minimumReleaseAgeExclude:
  - '@vitest/coverage-v8@5.1.0'
  - '@vitest/mocker@5.1.0'
  - '@vitest/spy@5.1.0'
  - vitest@5.1.0

# Dependency overrides and install-script policy for pnpm 12.
overrides:
  # Current glob consumers use the retained glob/globSync APIs. Nx still needs
  # minimatch 10's removed-in-11 makeRe API, so do not override it across majors.
  'glob@>=10 <14': '^14.0.2'
  'undici@>=7 <8': '^7.30.1'
  'minimatch@>=10 <11': '^10.2.6'
  'conventional-commits-parser@>=7 <8': '^7.1.3'
  '@typescript-eslint/utils@>=8 <9': '^8.72.1'
  'axios': '^1.20.0'
  'follow-redirects': '^1.16.1'
  'handlebars': '^4.7.10'
  'lodash': '^4.18.0'
  'postcss': '^8.5.23'
  'picomatch@<3': '^2.3.2'
  'picomatch@>=4 <5': '^4.0.4'
  'tar@<7.5.18': '^7.5.22'
  'js-yaml@>=3 <4': '^3.15.2'
  'js-yaml@>=4 <5': '^4.3.2'
  'brace-expansion@>=5 <6': '^5.0.12'
  'smol-toml': '^1.9.0'
  'pacote@>=21 <22': '^21.5.2'
  'uuid@<11.1.1': '^11.1.1'

allowBuilds:
  '@swc/core': true
  '@parcel/watcher': true
  nx: true
