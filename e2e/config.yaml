storage: /verdaccio/storage

uplinks:
  npmjs:
    url: https://registry.npmjs.org/

packages:
  # Suites packages must come from this test run, never from the public registry.
  '@suites/*':
    access: $all
    publish: $all

  '**':
    access: $all
    publish: $all
    proxy: npmjs

auth:
  htpasswd:
    file: ./htpasswd
    algorithm: bcrypt
    rounds: 10

logs:
  - {type: stdout, format: pretty, level: http}